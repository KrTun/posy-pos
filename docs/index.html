<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdeeea">
<meta name="description" content="Mobile till for a market stall: photo, item, amount, cash / transfer / LINE Pay.">
<title>Posy POS</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Posy POS">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap">
<style>
/* Same reset the Artifact viewer injects, so one source file renders identically in both places. */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px system-ui,-apple-system,sans-serif;background:#fdeeea}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body><style>
/* Layout: one phone-width column — sticky day total on top, fixed bottom nav, full-screen two-step entry sheet. */
:root{
  --bg:#fdeeea; --surface:#ffffff; --surface-2:#fbe2dc; --line:#f2cec6;
  --ink:#2a1a18; --muted:#7d5c57; --faint:#b99a95;
  --accent:#e4716a; --accent-ink:#ffffff; --accent-soft:#fcdfda;
  --cash:#2f7a4f; --bank:#3160a4; --linepay:#1f8a3b; --danger:#b3362b;
  --shadow:0 2px 12px rgba(120,70,64,.10);
  --ui:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Playfair Display",Georgia,"Songti TC",serif;
  --r:14px;
}
/* 刻意不跟隨系統深色模式：這支 App 在戶外日光下用，而且品牌色本身就是淺粉。
   深色只在使用者明確選擇時出現（Artifact 檢視器的主題切換）。 */
:root[data-theme="dark"]{
  --bg:#1c1412; --surface:#271d1b; --surface-2:#332624; --line:#42302d;
  --ink:#f6e9e6; --muted:#b69a95; --faint:#7d6360;
  --accent:#ef8a83; --accent-ink:#2a100d; --accent-soft:#3c2724;
  --cash:#5bbd84; --bank:#86b0ec; --linepay:#5cc777; --danger:#ef8075;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0 auto; max-width:480px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 116px;
  background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---- sticky day summary ---- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:14px 10px;
  border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.count{color:var(--muted);font-size:13px;padding-bottom:4px}
.paybar{display:flex;gap:8px;margin-top:10px}
.paybar .cell{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.paybar .cell b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.paybar .cell span{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.cash b{color:var(--cash)} .bank b{color:var(--bank)} .linepay b{color:var(--linepay)}

/* ---- sale rows ---- */
h2.sec{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:22px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px 9px 9px;
}
.row:active{background:var(--surface-2)}
.thumb{width:46px;height:46px;border-radius:9px;flex:none;object-fit:cover;background:var(--surface-2);display:block}
.thumb.empty{display:grid;place-items:center;color:var(--faint);font-size:17px}
.thumb.lost{color:var(--danger);font-size:15px}
.row .mid{flex:1;min-width:0}
.row .cat{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb.sm{width:38px;height:38px;border-radius:8px;font-size:14px}
.thumb.n{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;font-family:var(--num)}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;opacity:.4}
.row .amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;flex:none}
.tag{font-size:11px;font-weight:500}
.tag.cash{color:var(--cash)} .tag.bank{color:var(--bank)} .tag.linepay{color:var(--linepay)}

.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center}
.empty-state p{margin:0 0 4px;color:var(--muted);font-size:13.5px}
.empty-state .big{color:var(--ink);font-size:15px;font-weight:500;margin-bottom:8px}

/* ---- day group in log ---- */
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;gap:10px}
.day-head .d{font-weight:700;font-size:14.5px}
.day-head .s{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* ---- stats ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.2}
.tile span{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:10px;padding:3px;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 0;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:4.5em 1fr auto;gap:9px;align-items:center;font-size:13px}
.bar-row .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* track 與 fill 都要 display:block —— inline 元素不吃 width/height，長條會全部變成滿的 */
.track{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.fill{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar-row.zero .label,.bar-row.zero .v{opacity:.45}
.fill.cash{background:var(--cash)} .fill.bank{background:var(--bank)} .fill.linepay{background:var(--linepay)}
.bar-row .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:4px}
.spark .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.spark .col i{display:block;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px}
.spark .col i.hot{background:var(--accent)}
.spark-x{display:flex;gap:3px;margin-top:5px}
.spark-x span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--faint);font-family:var(--num)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.note-text{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px;font-weight:500;text-align:center}
.btn + .btn{margin-top:8px}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}

/* ---- category manager ---- */
.cat-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.cat-row{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:11px;padding:7px 8px 7px 11px}
.cat-row .nm{flex:1;min-width:0;overflow:hidden}
.cat-row .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .nm em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-family:var(--num)}
.cat-row.edit{flex-wrap:wrap}
.cat-row.edit input[type=text]{flex:1 1 7em}
.cat-row.dragging{opacity:.9;box-shadow:0 6px 16px rgba(120,70,64,.22);background:var(--surface)}
.mini.grip{cursor:grab;touch-action:none;color:var(--faint);font-size:15px;letter-spacing:-1px}
.cat-row.dragging .mini.grip{cursor:grabbing}
.wordmark{font-family:var(--display);font-size:27px;font-weight:600;line-height:1.1;margin:2px 0 14px}
.wordmark span{color:var(--accent)}
.chip em{font-style:normal;font-family:var(--num);font-size:12px;opacity:.7;margin-left:3px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;flex:none;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.mini:disabled{opacity:.3}
.mini.x{color:var(--danger)}
.cat-row input[type=text]{flex:1;min-width:0;padding:7px 9px}
.inline-add{display:flex;gap:7px;margin-top:10px}

.two-up{display:flex;gap:7px}
.two-up input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:11px 12px;font:inherit;
}
textarea{resize:vertical;min-height:90px;font-family:var(--num);font-size:11.5px;line-height:1.35}

/* ---- fab + nav ---- */
.fab{
  position:fixed; z-index:25;
  left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(60px + env(safe-area-inset-bottom,0px));
  max-width:448px; margin:0 auto;
  border:0; border-radius:13px; padding:15px;
  background:var(--accent); color:var(--accent-ink);
  font-size:16.5px; font-weight:700; letter-spacing:.02em;
  box-shadow:0 6px 18px rgba(200,90,82,.32);
}
.nav{
  position:fixed; inset:auto 0 0; z-index:26;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px)); padding-right:max(0px,env(safe-area-inset-right,0px));
}
.nav button{flex:1;border:0;background:transparent;padding:13px 0 14px;font-size:13px;color:var(--muted);font-weight:500}
.nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}

/* ---- sheets ---- */
.sheet{
  position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet-in{max-width:448px;margin:0 auto}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-bar h1{font-size:16px;font-weight:700;margin:0}
.sheet-bar button{border:0;background:transparent;padding:6px 2px;color:var(--accent);font-weight:500;font-size:14px}
.field{margin-top:14px}
.field > label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:7px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.shot{
  width:100%;border:1px dashed var(--line);background:var(--surface);border-radius:var(--r);
  padding:16px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:14px;
}
.shot-wrap{position:relative}
.shot-img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block;border:1px solid var(--line)}
.shot-x{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;width:32px;height:32px;font-size:15px;line-height:1}
.amount-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.amount-box .cur{color:var(--muted);font-size:15px;font-weight:500}
.amount-box .val{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:36px;font-weight:600;line-height:1.1}
.amount-box .val.zero{color:var(--faint)}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-family:var(--num);font-size:13.5px;color:var(--muted)}
.qty-bar{display:grid;grid-template-columns:4.2em 1fr 4.2em;align-items:stretch;gap:7px}
.qty-bar button{border:1px solid var(--line);background:var(--surface);border-radius:11px;font-family:var(--num);font-size:22px;font-weight:500;padding:0}
.qty-bar button:active{background:var(--surface-2)}
.qty-bar button:disabled{opacity:.3}
.qty-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px}
.qty-mid b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;line-height:1.15}
.qty-mid b .u{font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--muted);margin-left:3px}
.qty-mid em{font-style:normal;font-family:var(--num);font-size:12px;line-height:1.3;min-height:1.3em;color:var(--muted)}
.calc-fab{
  position:fixed;z-index:47;display:grid;place-items:center;
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;padding:0;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--accent);
  box-shadow:0 7px 20px rgba(120,70,64,.26);
}
.calc-fab:active{transform:scale(.95)}
.calc-fab[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pop-back{position:fixed;inset:0;z-index:45;background:rgba(90,52,48,.22)}
.pop{
  position:fixed;z-index:46;left:50%;transform:translateX(-50%);
  bottom:calc(82px + env(safe-area-inset-bottom,0px));
  width:min(352px,calc(100vw - 28px));max-height:calc(100vh - 150px);overflow-y:auto;
  background:var(--bg);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 16px 44px rgba(120,70,64,.3);padding:13px;
}
.pop-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.pop-bar h2{font-size:14px;font-weight:600;margin:0}
.pop .amount-box .cur{font-size:13.5px}
.pop .amount-box .val{font-size:30px}
.pop .pad{margin-top:8px}
.pop .pad button{padding:12px 0;font-size:20px}
.pop .note-text{margin-top:7px}
.change-box{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:11px;padding:10px 13px;margin-top:9px}
.change-box .l{font-size:13px;color:var(--muted)}
.change-box .r{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:23px;font-weight:600}
.change-box .r.short{color:var(--danger);font-size:18px}
.change-box.due{background:var(--accent-soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.pad button{
  border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:15px 0;
  font-family:var(--num);font-size:22px;font-weight:500;
}
.pad button:active{background:var(--surface-2)}
.pad button.wide{font-family:var(--ui);font-size:15px}
.recap{background:var(--accent-soft);border-radius:var(--r);padding:13px 15px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.recap .l{font-weight:500}
.recap .r{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600}
.pays{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.pay-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:17px 18px;
  font-size:17px;font-weight:700;
}
.pay-btn .hint{font-size:12px;font-weight:400;color:var(--muted)}
.pay-btn.cash{color:var(--cash)} .pay-btn.bank{color:var(--bank)} .pay-btn.linepay{color:var(--linepay)}
.detail-img{width:100%;border-radius:var(--r);display:block;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500}

.toast{
  position:fixed;z-index:50;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(126px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);font-size:14px;
}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:2px 4px}
.warn{background:var(--surface);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:13px;margin-top:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-row">
    <div>
      <div class="eyebrow" id="todayLabel">今天</div>
      <div class="total num" id="todayTotal">NT$0</div>
    </div>
    <div class="count" id="todayCount">0 筆</div>
  </div>
  <div class="paybar" id="todayPays"></div>
</header>

<main>
  <section id="view-today">
    <h2 class="sec">今天的紀錄</h2>
    <div class="list" id="todayList"></div>
    <button type="button" class="btn" id="copyDayBtn" style="margin-top:14px" hidden>複製今日結帳</button>
  </section>

  <section id="view-log" hidden>
    <h2 class="sec">全部紀錄</h2>
    <div id="logBody"></div>
  </section>

  <section id="view-stats" hidden>
    <h2 class="sec">統計</h2>
    <div class="seg" id="statSeg">
      <button data-range="month" class="on">本月</button>
      <button data-range="all">全部</button>
    </div>
    <div id="statBody"></div>
  </section>

  <section id="view-set" hidden>
    <h2 class="sec">設定</h2>
    <div id="setBody"></div>
  </section>
</main>

<button class="fab" id="fab">＋ 記一筆</button>

<nav class="nav" id="nav">
  <button data-view="today" class="on">今天</button>
  <button data-view="log">紀錄</button>
  <button data-view="stats">統計</button>
  <button data-view="set">設定</button>
</nav>

<!-- ===== entry sheet ===== -->

<script>
"use strict";
/* ---------- constants ---------- */
var PAYS = [
  {k:"cash",    n:"現金",     hint:"收現、找零"},
  {k:"bank",    n:"匯款",     hint:"轉帳、ATM"},
  {k:"linepay", n:"LINE Pay", hint:"掃碼收款"}
];
var PAYMAP = {cash:"現金", bank:"匯款", linepay:"LINE Pay"};
var CATS_DEFAULT = [
  {name:"長項鍊", price:0}, {name:"短項鍊", price:0}, {name:"手鍊", price:0},
  {name:"大花戒指", price:0}, {name:"串珠戒指", price:0}
];
var CATS_V1 = ["項鍊","手鍊","戒指","耳環","其他"];   // 第一版的出廠清單，沒動過才自動換成新的
var MAX_EDGE = 800, JPEG_Q = 0.7;

/* ---------- state ---------- */
/* 一列 = 賣掉的一件。同一個客人一次買幾件，就是幾列共用同一個 oid（訂單編號）；
   沒有 oid 的是改版前記的紀錄，一列就自己是一張單。 */
var sales = [];           // {id, oid, ts, cat, amount, pay, note, hasPhoto, demo}
var cats = CATS_DEFAULT.map(function(c){ return {name:c.name, price:c.price}; });  // price 0 = 不自動帶價
var db = null;
var photoMem = new Map();  // id -> data URL
var view = "today", statRange = "month";
var draft = null, pendingPhoto = null;   // draft.cart = 這張單已經加好的幾件，另外一件還在輸入中
var undoTimer = null, lastAdded = null;  // lastAdded = 最後記那張單的全部 id
var renamingCat = null;
var cloud = {url:"", token:"", at:0};   // 這支手機的雲端設定，不進程式碼
var storageMode = "";                   // persisted | best-effort | ""（瀏覽器不支援）
var isPreview = false;                  // 被嵌在別的網站裡（例如 Artifact 預覽），儲存空間是暫存的
try { isPreview = window.top !== window.self; } catch(e){ isPreview = true; }

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function money(n){ return "NT$" + Math.round(n).toLocaleString("zh-TW"); }
function pad2(n){ return (n<10?"0":"") + n; }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function monthKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth()+1); }
function hhmm(ts){ var d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function dayLabel(key){
  var p = key.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  var w = ["日","一","二","三","四","五","六"][d.getDay()];
  return (+p[1]) + "/" + (+p[2]) + "（" + w + "）";
}
function todayKey(){ return dayKey(Date.now()); }
/** 把 <input type=date> 的 YYYY-MM-DD 與 <input type=time> 的 HH:MM 合成本地時間戳。看不懂就回 null。 */
function parseWhen(dateStr, timeStr){
  var d = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(dateStr || "").trim());
  var t = /^(\d{1,2}):(\d{2})/.exec(String(timeStr || "").trim());
  if (!d || !t) return null;
  var hh = +t[1], mm = +t[2];
  if (hh > 23 || mm > 59) return null;
  var dt = new Date(+d[1], +d[2] - 1, +d[3], hh, mm, 0, 0);
  if (isNaN(dt.getTime()) || dt.getMonth() !== +d[2] - 1) return null;   // 擋掉 2/31 這種
  return dt.getTime();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function kb(n){ return n > 1024*1024 ? (n/1024/1024).toFixed(1) + " MB" : Math.round(n/1024) + " KB"; }

/* ---------- storage (IndexedDB; photos are stored as data-URL strings) ---------- */
function openDB(){
  return new Promise(function(res, rej){
    var r;
    try { r = indexedDB.open("stall-pos", 1); } catch(e){ rej(e); return; }
    r.onupgradeneeded = function(){
      var d = r.result;
      if (!d.objectStoreNames.contains("sales")) d.createObjectStore("sales", {keyPath:"id"});
      if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos");
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function tx(store, mode){ return db.transaction(store, mode || "readonly").objectStore(store); }
function req(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
async function putSale(s){ if (db) await req(tx("sales","readwrite").put(s)); }
async function delSale(id){
  if (!db) return;
  await req(tx("sales","readwrite").delete(id));
  try { await req(tx("photos","readwrite").delete(id)); } catch(e){}
  photoMem.delete(id);
}
async function putPhoto(id, dataURL){ if (db) await req(tx("photos","readwrite").put(dataURL, id)); }
async function getPhoto(id){ if (!db) return null; try { return await req(tx("photos").get(id)); } catch(e){ return null; } }
async function putMeta(k, v){ if (db) try { await req(tx("meta","readwrite").put(v, k)); } catch(e){} }
async function saveCats(){ await putMeta("cats", cats); }

function blobToDataURL(b){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.readAsDataURL(b);
  });
}
async function photoSrc(id){
  if (photoMem.has(id)) return photoMem.get(id);
  var v = await getPhoto(id);
  if (!v) return null;
  if (typeof v !== "string"){            // written by the first build, which stored Blobs
    try { v = await blobToDataURL(v); await putPhoto(id, v); } catch(e){ return null; }
  }
  photoMem.set(id, v);
  return v;
}

/* ---------- image shrinking ---------- */
async function shrink(file){
  var src = null;
  try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){
    src = await new Promise(function(res, rej){
      var u = URL.createObjectURL(file), i = new Image();
      i.onload = function(){ URL.revokeObjectURL(u); res(i); };
      i.onerror = function(){ URL.revokeObjectURL(u); rej(new Error("讀不到這張圖")); };
      i.src = u;
    });
  }
  var w = src.width, h = src.height, s = Math.min(1, MAX_EDGE / Math.max(w, h));
  var cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
  var c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  c.getContext("2d").drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close();
  return c.toDataURL("image/jpeg", JPEG_Q);
}

/* ---------- aggregation ---------- */
function sumOf(list){ var t = 0; for (var i=0;i<list.length;i++) t += list[i].amount; return t; }
/** 長條寬度：0 就真的是 0，非 0 至少留 4% 才看得見。 */
function barW(v, max){ return (!v || !max) ? "0%" : Math.max(4, v / max * 100).toFixed(1) + "%"; }
function byDay(key){ return sales.filter(function(s){ return dayKey(s.ts) === key; }); }
function payTotals(list){
  var o = {cash:0, bank:0, linepay:0};
  list.forEach(function(s){ if (o[s.pay] === undefined) o[s.pay] = 0; o[s.pay] += s.amount; });
  return o;
}
function usedCount(cat){ return sales.filter(function(s){ return s.cat === cat; }).length; }
/* 舊紀錄沒有 oid，就用它自己的 id 當訂單編號——等於一張單一件，不用搬資料。 */
function orderKey(s){ return s.oid || s.id; }
/** 把紀錄捲成訂單：[{key, ts, pay, note, items:[…], total}]，新的在前。 */
function ordersOf(list){
  var map = {}, out = [];
  list.forEach(function(s){
    var k = orderKey(s), o = map[k];
    if (!o){ o = map[k] = {key:k, ts:s.ts, pay:s.pay, note:s.note || "", items:[], total:0}; out.push(o); }
    o.items.push(s);
    o.total += s.amount;
    if (s.ts < o.ts){ o.ts = s.ts; o.pay = s.pay; }   // 整張單的時間與收款方式看最早那一件
    if (!o.note && s.note) o.note = s.note;
  });
  out.forEach(function(o){ o.items.sort(function(a,b){ return a.ts - b.ts; }); });
  out.sort(function(a,b){ return b.ts - a.ts; });
  return out;
}
function itemsOfOrder(key){
  return sales.filter(function(s){ return orderKey(s) === key; }).sort(function(a,b){ return a.ts - b.ts; });
}
function normCats(v){
  var out = [];
  (v || []).forEach(function(c){
    if (typeof c === "string") out.push({name:c, price:0});                       // first build stored plain names
    else if (c && c.name) out.push({name:String(c.name), price:Math.max(0, parseInt(c.price, 10) || 0)});
  });
  return out.length ? out : CATS_DEFAULT.map(function(c){ return {name:c.name, price:c.price}; });
}
function catIndex(name){ for (var i=0;i<cats.length;i++) if (cats[i].name === name) return i; return -1; }
function catPrice(name){ var i = catIndex(name); return i === -1 ? 0 : cats[i].price; }
function quickAmounts(){
  var count = {};
  sales.forEach(function(s){ count[s.amount] = (count[s.amount]||0) + 1; });
  return Object.keys(count)
    .map(function(a){ return {a:+a, c:count[a]}; })
    .sort(function(x,y){ return y.c - x.c || y.a - x.a; })
    .slice(0, 6)
    .sort(function(x,y){ return x.a - y.a; })
    .map(function(o){ return o.a; });
}

/* ---------- rendering: header ---------- */
function renderTop(){
  var list = byDay(todayKey());
  $("todayLabel").textContent = dayLabel(todayKey()) + " 今日營收";
  $("todayTotal").textContent = money(sumOf(list));
  var ord = ordersOf(list);
  $("todayCount").textContent = ord.length === list.length
    ? list.length + " 筆"
    : ord.length + " 單・" + list.length + " 件";
  var t = payTotals(list);
  $("todayPays").innerHTML = PAYS.map(function(p){
    return '<div class="cell ' + p.k + '"><span>' + p.n + '</span><b>' + money(t[p.k]||0) + "</b></div>";
  }).join("");
}

/* ---------- rendering: rows ---------- */
/** 一列 = 一張訂單。多件的縮圖用第一張有照片的，沒照片就顯示件數。 */
function rowHTML(o){
  var n = o.items.length, pic = "";
  for (var i=0;i<n;i++) if (o.items[i].hasPhoto){ pic = o.items[i].id; break; }
  var title = o.items.map(function(x){ return x.cat; }).join("、");
  return '<button type="button" class="row" data-order="' + esc(o.key) + '">' +
    (pic
      ? '<img class="thumb" data-photo="' + pic + '" alt="' + esc(o.items[0].cat) + '的照片">'
      : n > 1
        ? '<span class="thumb empty n" aria-hidden="true">' + n + "</span>"
        : '<span class="thumb empty" aria-hidden="true">◇</span>') +
    '<span class="mid"><span class="cat">' + esc(title) + '</span>' +
      '<span class="meta"><span class="tag ' + o.pay + '">' + esc(PAYMAP[o.pay] || o.pay) + "</span>" +
      '<span class="dot"></span>' + hhmm(o.ts) +
      (n > 1 ? '<span class="dot"></span>' + n + " 件" : "") +
      (o.note ? '<span class="dot"></span>' + esc(o.note) : "") +
    "</span></span>" +
    '<span class="amt">' + money(o.total) + "</span></button>";
}
async function hydrateThumbs(root){
  var imgs = root.querySelectorAll("img[data-photo]");
  for (var i=0;i<imgs.length;i++){
    var el = imgs[i];
    var u = await photoSrc(el.getAttribute("data-photo"));
    if (u) el.src = u;
    else el.outerHTML = '<span class="thumb empty lost" title="這張照片存不見了">⚠</span>';
  }
}

function renderToday(){
  var list = ordersOf(byDay(todayKey()));
  var el = $("todayList");
  $("copyDayBtn").hidden = !list.length;
  if (!list.length){
    el.innerHTML =
      '<div class="empty-state"><p class="big">今天還沒有紀錄</p>' +
      "<p>流程是：拍照 → 選品項 → 按金額 → 選收款方式，三秒一筆。</p>" +
      (sales.length ? "" : '<button type="button" class="btn ghost" id="demoBtn" style="margin-top:12px">放三筆示範資料看看</button>') +
      "</div>";
    var d = $("demoBtn");
    if (d) d.addEventListener("click", addDemo);
    return;
  }
  el.innerHTML = list.map(rowHTML).join("");
  hydrateThumbs(el);
}

function renderLog(){
  var el = $("logBody");
  if (!sales.length){
    el.innerHTML = '<div class="empty-state"><p class="big">還沒有任何紀錄</p><p>記的每一筆都會按日期收在這裡。</p></div>';
    return;
  }
  var groups = {};
  sales.forEach(function(s){ var k = dayKey(s.ts); (groups[k] = groups[k] || []).push(s); });
  var keys = Object.keys(groups).sort().reverse();
  el.innerHTML = keys.map(function(k){
    var g = groups[k], ord = ordersOf(g);
    return '<div class="day-head"><span class="d">' + dayLabel(k) + "</span>" +
      '<span class="s">' + (ord.length === g.length ? g.length + " 筆" : ord.length + " 單・" + g.length + " 件") +
      "・" + money(sumOf(g)) + "</span></div>" +
      '<div class="list">' + ord.map(rowHTML).join("") + "</div>";
  }).join("");
  hydrateThumbs(el);
}

function renderStats(){
  var list = statRange === "month"
    ? sales.filter(function(s){ return monthKey(s.ts) === monthKey(Date.now()); })
    : sales.slice();
  var total = sumOf(list), n = list.length, orders = ordersOf(list);
  var el = $("statBody");
  if (!n){
    el.innerHTML = '<div class="empty-state" style="margin-top:12px"><p class="big">這段期間還沒有紀錄</p><p>記幾筆之後，這裡會算出品項和收款方式的佔比。</p></div>';
    return;
  }

  var pt = payTotals(list);
  var payMax = Math.max(pt.cash, pt.bank, pt.linepay, 1);

  var catAgg = {};
  list.forEach(function(s){
    var c = catAgg[s.cat] = catAgg[s.cat] || {sum:0, n:0};
    c.sum += s.amount; c.n++;
  });
  var catRows = Object.keys(catAgg).map(function(k){ return {k:k, sum:catAgg[k].sum, n:catAgg[k].n}; })
    .sort(function(a,b){ return b.sum - a.sum; });
  var catMax = catRows.length ? catRows[0].sum : 1;

  var days = [];
  for (var i=13;i>=0;i--){
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    var k = dayKey(d.getTime());
    days.push({k:k, sum:sumOf(byDay(k)), d:d});
  }
  var dayMax = Math.max.apply(null, days.map(function(x){ return x.sum; }).concat([1]));

  el.innerHTML =
    '<div class="tiles" style="margin-top:12px">' +
      '<div class="tile"><b>' + money(total) + "</b><span>營收</span></div>" +
      '<div class="tile"><b>' + orders.length + "</b><span>訂單</span></div>" +
      '<div class="tile"><b>' + n + "</b><span>件數</span></div>" +
    "</div>" +
    '<div class="tiles" style="grid-template-columns:repeat(2,1fr);margin-top:8px">' +
      '<div class="tile"><b>' + money(total/orders.length) + "</b><span>平均客單價（每張單）</span></div>" +
      '<div class="tile"><b>' + money(total/n) + "</b><span>平均單品價（每件）</span></div>" +
    "</div>" +

    '<div class="card" style="margin-top:10px"><div class="eyebrow">收款方式</div><div class="bars" style="margin-top:10px">' +
      PAYS.map(function(p){
        var v = pt[p.k] || 0;
        return '<div class="bar-row' + (v ? "" : " zero") + '"><span class="label">' + p.n + "</span>" +
          '<span class="track"><i class="fill ' + p.k + '" style="width:' + barW(v, payMax) + '"></i></span>' +
          '<span class="v">' + money(v) + "</span></div>";
      }).join("") +
    "</div></div>" +

    '<div class="card"><div class="eyebrow">品項</div><div class="bars" style="margin-top:10px">' +
      catRows.map(function(c){
        return '<div class="bar-row"><span class="label">' + esc(c.k) + "</span>" +
          '<span class="track"><i class="fill" style="width:' + barW(c.sum, catMax) + '"></i></span>' +
          '<span class="v">' + c.n + "件・" + money(c.sum) + "</span></div>";
      }).join("") +
    "</div></div>" +

    '<div class="card"><div class="eyebrow">近 14 天</div>' +
      '<div class="spark">' + days.map(function(x){
        var h = (x.sum / dayMax * 100).toFixed(1);
        return '<span class="col" title="' + x.k + " " + money(x.sum) + '"><i class="' + (x.sum?"hot":"") + '" style="height:' + h + '%"></i></span>';
      }).join("") + "</div>" +
      '<div class="spark-x">' + days.map(function(x, i){
        return "<span>" + (i % 3 === 0 ? (x.d.getMonth()+1) + "/" + x.d.getDate() : "") + "</span>";
      }).join("") + "</div>" +
      '<p class="note-text">最高的一天 ' + money(dayMax) + "</p>" +
    "</div>";
}

/* ---------- 品項拖曳排序 ---------- */
/* 拖的時候直接搬 DOM 節點、不重畫，否則手指底下的元素被換掉就收不到後續事件。 */
var dragEl = null;
function catDragStart(e){
  var grip = e.target.closest("[data-grip]");
  if (!grip || !$("catList")) return;
  dragEl = grip.closest(".cat-row");
  if (!dragEl) return;
  dragEl.classList.add("dragging");
  e.preventDefault();
}
function catDragMove(e){
  if (!dragEl) return;
  e.preventDefault();
  var list = $("catList");
  if (!list) { dragEl = null; return; }
  var rows = [].slice.call(list.children).filter(function(n){ return n !== dragEl; });
  var before = null;
  for (var i=0;i<rows.length;i++){
    var r = rows[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height/2){ before = rows[i]; break; }
  }
  if (before) list.insertBefore(dragEl, before);
  else list.appendChild(dragEl);
}
async function catDragEnd(){
  if (!dragEl) return;
  dragEl.classList.remove("dragging");
  dragEl = null;
  var list = $("catList");
  if (!list) return;
  var order = [].slice.call(list.children).map(function(n){ return n.getAttribute("data-name"); });
  var next = [];
  order.forEach(function(nm){ var i = catIndex(nm); if (i !== -1) next.push(cats[i]); });
  if (next.length === cats.length) cats = next;      // 只有完全對得起來才採用
  await saveCats();
  renderSettings();
}

/* ---------- category management ---------- */
async function moveCat(i, dir){
  var j = i + dir;
  if (j < 0 || j >= cats.length) return;
  var t = cats[i]; cats[i] = cats[j]; cats[j] = t;
  await saveCats();
  renderSettings();
}
async function doEditCat(oldName){
  var next = String($("editName").value || "").trim();
  var price = Math.max(0, parseInt(String($("editPrice").value).replace(/[^\d]/g, ""), 10) || 0);
  var i = catIndex(oldName);
  renamingCat = null;
  if (i === -1){ renderSettings(); return; }
  if (!next) next = oldName;
  if (next !== oldName && catIndex(next) !== -1){ renderSettings(); toast("已經有同名的品項了"); return; }
  cats[i] = {name:next, price:price};
  var hit = next === oldName ? [] : sales.filter(function(s){ return s.cat === oldName; });
  for (var k=0;k<hit.length;k++){ hit[k].cat = next; hit[k].synced = 0; await putSale(hit[k]); }
  await saveCats();
  renderSettings(); renderTop();
  toast(hit.length ? "已更新，過去 " + hit.length + " 筆紀錄的品項一起改了" : "已更新");
}
async function deleteCat(name){
  if (cats.length < 2) return;
  cats = cats.filter(function(c){ return c.name !== name; });
  await saveCats();
  renderSettings();
  var used = usedCount(name);
  toast(used ? "已從按鈕列拿掉，" + used + " 筆舊紀錄保持原樣" : "已刪除");
}
async function addCat(name, price){
  var v = String(name || "").trim();
  if (!v) return false;
  if (catIndex(v) !== -1){ toast("已經有這個品項了"); return false; }
  cats.push({name:v, price:Math.max(0, parseInt(String(price).replace(/[^\d]/g, ""), 10) || 0)});
  await saveCats();
  return true;
}

async function fullJSON(){

    if (!sales[i].hasPhoto) continue;
    var u = await photoSrc(sales[i].id);
    if (u) photos[sales[i].id] = u;

async function runImport(){
  var raw = String($("impBox").value || "").trim();
  if (!raw){ toast("先貼上備份文字"); return; }
  var data;
  try { data = JSON.parse(raw); } catch(e){ toast("這段文字不是備份格式"); return; }
  if (!data || data.app !== "stall-pos" || !Array.isArray(data.sales)){ toast("這段文字不是這個 App 的備份"); return; }
  var have = {};
  sales.forEach(function(s){ have[s.id] = true; });
  var added = 0, pics = 0;
  for (var i=0;i<data.sales.length;i++){
    var s = data.sales[i];
    if (!s || !s.id || have[s.id]) continue;
    sales.push(s); have[s.id] = true; added++;
    await putSale(s);
    var u = data.photos && data.photos[s.id];
    if (u && typeof u === "string"){ await putPhoto(s.id, u); photoMem.set(s.id, u); pics++; }
  }
  if (Array.isArray(data.cats)){
    var inc = normCats(data.cats);
    for (var j=0;j<inc.length;j++){
      if (catIndex(inc[j].name) === -1) cats.push(inc[j]);
    }
    await saveCats();
  }
  sales.sort(function(a,b){ return a.ts - b.ts; });
  $("impBox").value = "";
  renderAll();
  toast("還原了 " + added + " 筆" + (pics ? "、" + pics + " 張照片" : ""));
}

/* ---------- Google 雲端同步（Apps Script 後端） ---------- */
function pendingCount(){ return sales.filter(function(s){ return !s.synced; }).length; }
async function cloudCall(action, payload){
  if (!cloud.url) throw new Error("還沒填 Apps Script 網址");
  var res = await fetch(cloud.url, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   // text/plain 才不會觸發 preflight
    body: JSON.stringify(Object.assign({action:action, token:cloud.token}, payload || {}))
  });
  var txt = await res.text(), out;
  try { out = JSON.parse(txt); }
  catch(e){ throw new Error("雲端回了看不懂的內容，確認網址是 /exec 結尾、部署權限是「任何人」"); }
  if (!out.ok) throw new Error(out.error || "雲端拒絕了這次請求");
  return out;
}
function cloudError(e){
  var m = String((e && e.message) || e);
  if (/failed to fetch|networkerror|load failed/i.test(m))
    m = "連不到雲端。如果你是從 Claude 的預覽網址開這一頁，同步只能在 App 版（GitHub Pages 的網址）用。";
  toast(m);
}
async function saveCloud(){
  cloud.url = String($("cloudUrl").value || "").trim();
  cloud.token = String($("cloudToken").value || "").trim();
  await putMeta("cloud", cloud);
  renderSettings();
  toast(cloud.url && !/\/exec$/.test(cloud.url) ? "存好了，但網址通常要用 /exec 結尾" : "雲端設定已存在這支手機");
}
async function cloudPing(btn){
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = "測試中…";
  try { var out = await cloudCall("ping", {}); toast(out.msg || "連上了"); }
  catch(e){ cloudError(e); }
  btn.disabled = false; btn.textContent = label;
}
function syncRow(s){
  return {id:s.id, oid:orderKey(s), ts:s.ts, cat:s.cat, amount:s.amount,
          pay:PAYMAP[s.pay] || s.pay, payKey:s.pay, note:s.note || "", hasPhoto:!!s.hasPhoto};
}
async function pushAll(btn){
  var label = btn.textContent;
  btn.disabled = true;
  try {
    var pend = sales.filter(function(s){ return !s.synced; });
    for (var i=0;i<pend.length;i+=120){
      var chunk = pend.slice(i, i+120);
      btn.textContent = "上傳帳目 " + Math.min(i + chunk.length, pend.length) + "/" + pend.length;
      await cloudCall("push", {sales: chunk.map(syncRow)});
    }
    var pics = sales.filter(function(s){ return s.hasPhoto && !s.photoUp; });
    for (var j=0;j<pics.length;j++){
      btn.textContent = "上傳照片 " + (j+1) + "/" + pics.length;
      var u = await photoSrc(pics[j].id);
      if (!u) continue;
      var r = await cloudCall("photo", {id:pics[j].id, dataUrl:u});
      pics[j].photoUp = r.fileId || "1";
      await putSale(pics[j]);
    }
    for (var k=0;k<pend.length;k++){ pend[k].synced = 1; await putSale(pend[k]); }
    cloud.at = Date.now();
    await putMeta("cloud", cloud);
    renderSettings();
    toast("上傳完成：帳目 " + pend.length + " 筆、照片 " + pics.length + " 張");
  } catch(e){
    btn.disabled = false; btn.textContent = label;
    cloudError(e);
  }
}
async function pullAll(btn){
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = "拉取中…";
  try {
    var out = await cloudCall("pull", {});
    var have = {};
    sales.forEach(function(s){ have[s.id] = true; });
    var inc = out.sales || [], added = 0;
    for (var i=0;i<inc.length;i++){
      var r = inc[i];
      if (!r || !r.id || have[String(r.id)]) continue;
      var s = {id:String(r.id), oid:String(r.oid || r.id), ts:Number(r.ts) || Date.now(),
               cat:String(r.cat || "其他"),
               amount:Math.max(0, parseInt(r.amount, 10) || 0), pay:String(r.payKey || "cash"),
               note:String(r.note || ""), hasPhoto:false, synced:1};
      if (r.photoUrl) s.photoUrl = String(r.photoUrl);   // 照片留在 Drive，這裡只帶連結
      sales.push(s); have[s.id] = true; added++;
      await putSale(s);
    }
    sales.sort(function(a,b){ return a.ts - b.ts; });
    renderAll();
    toast(added ? "拉回 " + added + " 筆（照片留在 Drive，點進該筆可開連結）" : "雲端沒有這支手機缺的紀錄");
  } catch(e){ cloudError(e); }
  btn.disabled = false; btn.textContent = label;
}

function q(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
function csvText(){

  sales.slice().sort(function(a,b){ return a.ts - b.ts; }).forEach(function(s){
    rows.push([dayKey(s.ts), hhmm(s.ts), orderKey(s), q(s.cat), s.amount,
      PAYMAP[s.pay]||s.pay, q(s.note), s.hasPhoto ? "有" : ""].join(","));
  });
  return rows.join("\n");
}

/* ---------- toast ---------- */
function toast(msg, actLabel, actFn){
  clearTimeout(undoTimer);
  $("toastMsg").textContent = msg;
  var b = $("toastAct");
  if (actLabel){
    b.hidden = false;
    b.textContent = actLabel;
    b.onclick = function(){ $("toast").hidden = true; if (actFn) actFn(); };
  } else {
    b.hidden = true; b.onclick = null;
  }
  $("toast").hidden = false;
  undoTimer = setTimeout(function(){ $("toast").hidden = true; }, actLabel ? 6000 : 2600);
}

/* ---------- entry flow ---------- */
/** 把輸入中的那一件清空。keepCat 有值就停在同一個品項（同客人常常連買同款）。
    blank＝加入一件之後的清空：金額要留空，不要再自動帶預設價，
    否則她按完「繼續新增」直接按下一步，會把同一款多算一件。 */
function freshLine(keepCat, blank){
  var i = keepCat ? catIndex(keepCat) : -1;
  var c = i !== -1 ? cats[i] : (cats[0] || {name:"其他", price:0});
  draft.cat = c.name;
  draft.amount = (!blank && c.price) ? String(c.price) : "";
  draft.qty = 1;
  pendingPhoto = null;
  resetShot();
}
function openSheet(){
  draft = {cart:[], cat:"", amount:"", qty:1};
  closeChange();
  freshLine(null);
  $("noteInput").value = "";
  $("step2").hidden = true;
  $("step1").hidden = false;
  renderCats(); renderQuick(); renderCart(); renderAmount();
  $("sheet").hidden = false;
  $("sheet").scrollTop = 0;
}
function closeSheet(){
  $("sheet").hidden = true;
  pendingPhoto = null;
  draft = null;
  closeChange();
}
function resetShot(){
  $("shotWrap").hidden = true;
  $("shotBtn").hidden = false;
  $("shotImg").removeAttribute("src");
  $("shotInput").value = "";
}
function renderCats(){
  $("catChips").innerHTML = cats.map(function(c){
    return '<button type="button" class="chip' + (draft.cat === c.name ? " on" : "") + '" data-cat="' + esc(c.name) + '">' +
      esc(c.name) + (c.price ? " <em>" + c.price + "</em>" : "") + "</button>";
  }).join("");
}
function renderQuick(){
  var q = quickAmounts();
  $("quickAmts").innerHTML = q.length
    ? q.map(function(a){ return '<button type="button" data-amt="' + a + '">' + money(a) + "</button>"; }).join("")
    : "";
}
var cashStr = "";        // 找錢計算機打進去的數字，不存檔、不進帳
function cashAmount(){ return cashStr === "" ? 0 : (parseInt(cashStr, 10) || 0); }
/** 離開這張單就收起來、數字歸零，不要把上一個客人的現金留給下一個。 */
function closeChange(){
  cashStr = "";
  var p = $("changePanel");
  if (!p) return;
  p.hidden = true;
  $("changeBack").hidden = true;
  $("changeToggle").setAttribute("aria-expanded", "false");
}
function curAmount(){ return draft.amount === "" ? 0 : (parseInt(draft.amount, 10) || 0); }
/** 這張單目前的全部件數：已加入的，加上還在輸入中、金額已經有數字的那一件。 */
function draftLines(){
  var out = draft.cart.slice();
  var v = curAmount();
  if (v > 0 && draft.cat) out.push({cat:draft.cat, amount:v, qty:draft.qty, photo:pendingPhoto});
  return out;
}
/* 數量只活在記帳介面：存檔時會展開成 N 列，一列永遠是賣掉的一件。
   cart 列沒有 qty 就當 1 件算。 */
function lineQty(l){ return Math.max(1, l.qty || 1); }
function lineTotal(l){ return l.amount * lineQty(l); }
function lineSum(lines){ var t = 0; lines.forEach(function(l){ t += lineTotal(l); }); return t; }
function lineCount(lines){ var n = 0; lines.forEach(function(l){ n += lineQty(l); }); return n; }
function lineRowHTML(l, i, delAttr){
  var n = lineQty(l);
  return '<div class="cat-row">' +
    (l.photo ? '<img class="thumb sm" src="' + l.photo + '" alt="">' : '<span class="thumb empty sm" aria-hidden="true">◇</span>') +
    '<span class="nm"><b>' + esc(l.cat) + (n > 1 ? " ×" + n : "") + "</b><em>" +
      (n > 1 ? money(l.amount) + " × " + n + " ＝ " + money(lineTotal(l)) : money(l.amount)) + "</em></span>" +
    (delAttr
      ? '<button type="button" class="mini" data-cart-dec="' + i + '" aria-label="這款減一件">−</button>' +
        '<button type="button" class="mini" data-cart-inc="' + i + '" aria-label="這款加一件">＋</button>' +
        '<button type="button" class="mini x" data-cart-del="' + i + '" aria-label="從這筆訂單移除">✕</button>'
      : "") +
  "</div>";
}
function renderCart(){
  var n = draft.cart.length;
  $("cartField").hidden = !n;
  if (!n) return;
  $("cartCount").textContent = lineCount(draft.cart);
  $("cartList").innerHTML = draft.cart.map(function(l, i){ return lineRowHTML(l, i, true); }).join("");
  $("cartSub").textContent = money(lineSum(draft.cart));
}
function renderAmount(){
  var v = curAmount();
  var el = $("amtVal");
  el.textContent = v.toLocaleString("zh-TW");
  el.classList.toggle("zero", v === 0);
  var lines = draftLines(), cnt = lineCount(lines);
  $("addMore").disabled = !(v > 0 && draft.cat);
  $("next1").disabled = !lines.length;
  $("next1").textContent = cnt > 1
    ? "下一步：收款方式（" + cnt + " 件 " + money(lineSum(lines)) + "）"
    : "下一步：收款方式";
  $("toStep2").style.color = lines.length ? "var(--accent)" : "var(--muted)";
  renderQty();
}
/** 數量欄：只管「正在輸入的那一件」，並把單價×N 算給她看。 */
function renderQty(){
  var n = draft.qty, v = curAmount();
  $("qtyVal").textContent = n;
  $("qtyMinus").disabled = n <= 1;
  // 這行的高度固定留著，按＋的時候下面的按鈕才不會跳一下導致按錯
  $("qtySub").textContent = v <= 0 ? ""
    : (n > 1 ? money(v) + " × " + n + " ＝ " + money(v * n) : "一件 " + money(v));
}

/* ---------- 找錢計算：純算給人看，不寫進帳也不动欄位 ---------- */
function renderChange(){
  if (!draft) return;
  var v = cashAmount(), need = lineSum(draftLines()), d = v - need;
  var el = $("cashVal"), r = $("changeVal");
  el.textContent = v.toLocaleString("zh-TW");
  el.classList.toggle("zero", v === 0);
  if (!cashStr){ r.textContent = "—"; r.className = "r"; }
  else if (d < 0){ r.textContent = "還差 " + money(-d); r.className = "r short"; }
  else { r.textContent = money(d); r.className = "r"; }
}
/** 把輸入中的那一件收進這張單，接著記下一件。 */
function addLine(){
  var v = curAmount();
  if (!(v > 0 && draft.cat)) return;
  var nm = draft.cat, n = draft.qty, hit = -1;
  // 同品項、同價、兩邊都沒拍照 → 併進同一列加數量，
  // 讓「數量」與「繼續新增」兩條路徑的結果一致。有照片就不併，照片是每件各自的。
  if (!pendingPhoto){
    for (var i=0;i<draft.cart.length;i++){
      var c = draft.cart[i];
      if (c.cat === nm && c.amount === v && !c.photo){ hit = i; break; }
    }
  }
  if (hit !== -1) draft.cart[hit].qty = lineQty(draft.cart[hit]) + n;
  else draft.cart.push({cat:nm, amount:v, qty:n, photo:pendingPhoto});
  freshLine(nm, true);
  renderCats(); renderCart(); renderAmount();
  $("sheet").scrollTop = 0;
  toast("加入 " + nm + (n > 1 ? " ×" + n : "") + " " + money(v * n) +
        "，這張單共 " + lineCount(draft.cart) + " 件");
}
function toStep2(){
  var lines = draftLines(), cnt = lineCount(lines);
  if (!lines.length) return;
  closeChange();
  $("recapCat").textContent = cnt > 1
    ? cnt + " 件"
    : lines[0].cat + (lines[0].photo ? "・已拍照" : "");
  $("recapAmt").textContent = money(lineSum(lines));
  var rl = $("recapList");
  rl.hidden = cnt < 2;
  rl.innerHTML = cnt < 2 ? "" : lines.map(function(l, i){ return lineRowHTML(l, i, false); }).join("");
  renderChange();
  $("step1").hidden = true;
  $("step2").hidden = false;
  $("sheet").scrollTop = 0;
}
async function commit(pay){
  var lines = draftLines();
  if (!lines.length) return;
  var note = $("noteInput").value.trim();
  var now = Date.now(), oid = uid(), total = lineSum(lines);
  // 同一張單共用 oid；數量 N 在這裡展開成 N 列（一列＝賣掉的一件，資料模型沒變）；
  // ts 差 1 毫秒只是讓件的順序穩定，顯示上同分同秒
  var rows = [], pics = [], k = 0;
  lines.forEach(function(l){
    var n = lineQty(l);
    for (var j=0;j<n;j++){
      // 照片只掛在同款的第一件：同一張 data URL 存 N 份是白白吃掉配額
      var pic = (j === 0) ? l.photo : null;
      rows.push({id: uid(), oid: oid, ts: now + k, cat: l.cat, amount: l.amount,
                 pay: pay, note: note, hasPhoto: !!pic});
      pics.push(pic);
      k++;
    }
  });
  // 照片要先進記憶體再重畫，不然列表的縮圖會比 putPhoto 早一步去資料庫找，找不到就畫成「照片存不見了」
  rows.forEach(function(r, i){
    sales.push(r);
    if (pics[i]) photoMem.set(r.id, pics[i]);
  });
  closeSheet();
  view = "today"; syncNav();
  renderAll();
  try {
    for (var i=0;i<rows.length;i++){
      if (pics[i]) await putPhoto(rows[i].id, pics[i]);
      await putSale(rows[i]);
    }
  } catch(e){
    showStorageWarning();
  }
  lastAdded = rows.map(function(r){ return r.id; });
  toast("已記 " + (rows.length > 1 ? rows.length + " 件" : rows[0].cat) + " " + money(total) +
        "（" + (PAYMAP[pay]||pay) + "）", "撤銷", undoLast);
}
async function undoLast(){
  if (!lastAdded || !lastAdded.length) return;
  var ids = lastAdded; lastAdded = null;
  var gone = {};
  ids.forEach(function(i){ gone[i] = 1; });
  sales = sales.filter(function(s){ return !gone[s.id]; });
  for (var i=0;i<ids.length;i++) await delSale(ids[i]);
  renderAll();
  toast("已撤銷");
}

/* ---------- detail / edit ---------- */
/* 明細頁處理的是「一張訂單」。單件訂單維持原本的樣子（直接改金額與品項）；
   多件的多一張「訂單內容」卡，每件可以單獨改，收款／時間／備註則套用到整張單。 */
var detailKey = null, armDelete = false, editLine = null, editLineCat = "";

function catChipsHTML(sel, attr){
  var html = cats.map(function(c){
    return '<button type="button" class="chip' + (c.name === sel ? " on" : "") + '" ' + attr + '="' + esc(c.name) + '">' + esc(c.name) + "</button>";
  }).join("");
  if (sel && catIndex(sel) === -1)   // 品項被刪掉的舊紀錄，照樣讓它顯示
    html += '<button type="button" class="chip on" ' + attr + '="' + esc(sel) + '">' + esc(sel) + "</button>";
  return html;
}
function itemsCardHTML(items, picMap){
  return '<div class="card"><div class="eyebrow">訂單內容（' + items.length + " 件）</div>" +
    '<p class="note-text">✎ 單獨改這一件的品項和金額；✕ 把這一件從訂單移除。只剩一件時不能移除，請用下面的「刪除整張訂單」。</p>' +
    '<div class="cat-list">' + items.map(function(x){
      if (editLine === x.id){
        return '<div class="cat-row edit">' +
          '<input type="text" id="lineAmt" inputmode="numeric" value="' + x.amount + '" aria-label="金額">' +
          '<button type="button" class="mini" data-line-ok="' + x.id + '" aria-label="儲存">✓</button>' +
          '<button type="button" class="mini" data-line-cancel="1" aria-label="取消">✕</button>' +
          '<div class="chips" id="lineCats" style="flex:1 1 100%">' + catChipsHTML(editLineCat, "data-line-cat") + "</div>" +
        "</div>";
      }
      return '<div class="cat-row">' +
        (picMap[x.id] ? '<img class="thumb sm" src="' + picMap[x.id] + '" alt="">'
                      : '<span class="thumb empty sm" aria-hidden="true">◇</span>') +
        '<span class="nm"><b>' + esc(x.cat) + "</b><em>" + money(x.amount) + "</em></span>" +
        '<button type="button" class="mini" data-line="' + x.id + '" aria-label="改這一件">✎</button>' +
        '<button type="button" class="mini x" data-line-del="' + x.id + '"' + (items.length < 2 ? " disabled" : "") + ' aria-label="從訂單移除這一件">✕</button>' +
      "</div>";
    }).join("") + "</div></div>";
}

async function openDetail(key, keepScroll){
  var items = itemsOfOrder(key);
  if (!items.length){ closeDetail(); return; }
  detailKey = key; armDelete = false;
  var multi = items.length > 1, head = items[0];
  var total = 0, note = "";
  items.forEach(function(x){ total += x.amount; if (!note && x.note) note = x.note; });

  var picMap = {};
  for (var i=0;i<items.length;i++){
    if (!items[i].hasPhoto) continue;
    var u = await photoSrc(items[i].id);
    if (u) picMap[items[i].id] = u;
  }

  var pic = "";
  if (!multi){
    pic = picMap[head.id] ? '<img class="detail-img" src="' + picMap[head.id] + '" alt="' + esc(head.cat) + '的照片">'
        : head.photoUrl ? '<a class="btn" href="' + esc(head.photoUrl) + '" target="_blank" rel="noopener">在 Google Drive 看這張照片</a>'
        : head.hasPhoto ? '<div class="warn" style="margin-top:0">這一筆的照片讀不到了</div>' : "";
  }

  $("detailBody").innerHTML = pic +
    '<div class="card" style="margin-top:12px">' +
      '<div class="kv"><span>' + (multi ? "整張單合計" : "金額") + '</span><b class="num" style="font-size:19px">' + money(total) + "</b></div>" +
      (multi ? '<div class="kv"><span>件數</span><b class="num">' + items.length + " 件</b></div>"
             : '<div class="kv"><span>品項</span><b>' + esc(head.cat) + "</b></div>") +
      '<div class="kv"><span>收款</span><b class="tag ' + head.pay + '" style="font-size:14px">' + esc(PAYMAP[head.pay]||head.pay) + "</b></div>" +
      '<div class="kv"><span>時間</span><b>' + dayLabel(dayKey(head.ts)) + " " + hhmm(head.ts) + "</b></div>" +
      (note ? '<div class="kv"><span>備註</span><b>' + esc(note) + "</b></div>" : "") +
    "</div>" +

    (multi ? itemsCardHTML(items, picMap) : "") +

    '<div class="card"><div class="eyebrow">' + (multi ? "修改整張訂單" : "修改") + "</div>" +
      (multi ? "" :
        '<div class="field"><label for="edAmt">金額</label>' +
          '<input type="text" id="edAmt" inputmode="numeric" value="' + head.amount + '"></div>' +
        '<div class="field"><label>品項</label><div class="chips" id="edCats">' + catChipsHTML(head.cat, "data-ed-cat") + "</div></div>") +
      '<div class="field"><label>收款方式</label><div class="chips" id="edPays">' +
        PAYS.map(function(p){ return '<button type="button" class="chip' + (p.k===head.pay?" on":"") + '" data-ed-pay="' + p.k + '">' + p.n + "</button>"; }).join("") +
      "</div></div>" +
      '<div class="field"><label for="edDate">日期與時間</label>' +
        '<div class="two-up"><input type="date" id="edDate" value="' + dayKey(head.ts) + '">' +
        '<input type="time" id="edTime" value="' + hhmm(head.ts) + '"></div></div>' +
      '<div class="field"><label for="edNote">備註</label>' +
        '<input type="text" id="edNote" maxlength="40" value="' + esc(note) + '"></div>' +
      (multi ? '<p class="note-text">收款方式、日期時間、備註會套用到這張單的全部 ' + items.length + " 件。</p>" : "") +
      '<div class="field"><button type="button" class="btn primary" id="edSave">儲存修改</button>' +
      '<button type="button" class="btn danger" id="edDel">' + (multi ? "刪除整張訂單（" + items.length + " 件）" : "刪除這一筆") + "</button></div>" +
    "</div>";

  var edCat = head.cat, edPay = head.pay;
  if (!multi) $("edCats").addEventListener("click", function(e){
    var b = e.target.closest("[data-ed-cat]"); if (!b) return;
    edCat = b.getAttribute("data-ed-cat");
    this.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("on", c === b); });
  });
  $("edPays").addEventListener("click", function(e){
    var b = e.target.closest("[data-ed-pay]"); if (!b) return;
    edPay = b.getAttribute("data-ed-pay");
    this.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("on", c === b); });
  });
  $("edSave").addEventListener("click", async function(){
    var v = null;
    if (!multi){
      v = parseInt(String($("edAmt").value).replace(/[^\d]/g, ""), 10);
      if (!(v > 0)){ toast("金額要大於 0"); return; }
    }
    var when = parseWhen($("edDate").value, $("edTime").value);
    if (when === null){ toast("日期或時間填得不完整，請重選"); return; }
    var nt = $("edNote").value.trim();
    try {
      for (var i=0;i<items.length;i++){
        var s = items[i];
        s.pay = edPay; s.note = nt; s.ts = when + i;   // 整張單搬到同一個時間，件的先後不變
        s.synced = 0;                                  // 改過的要重新上傳
        if (!multi){ s.amount = v; s.cat = edCat; }
        await putSale(s);
      }
    } catch(e){ showStorageWarning(); }
    sales.sort(function(a,b){ return a.ts - b.ts; });
    closeDetail(); renderAll(); toast("已更新");
  });
  $("edDel").addEventListener("click", async function(){
    if (!armDelete){
      armDelete = true;
      this.textContent = multi ? "再按一次就刪掉這 " + items.length + " 件" : "再按一次就真的刪掉";
      return;
    }
    var ids = items.map(function(x){ return x.id; }), gone = {};
    ids.forEach(function(i){ gone[i] = 1; });
    sales = sales.filter(function(x){ return !gone[x.id]; });
    for (var i=0;i<ids.length;i++) await delSale(ids[i]);
    closeDetail(); renderAll(); toast(multi ? "整張訂單已刪除" : "已刪除");
  });

  $("detail").hidden = false;
  if (!keepScroll) $("detail").scrollTop = 0;
  var la = $("lineAmt");
  if (la){ la.focus(); la.select(); }
}
function closeDetail(){ $("detail").hidden = true; detailKey = null; editLine = null; }

/** 存單獨那一件的修改。 */
async function saveLine(id){
  var s = sales.filter(function(x){ return x.id === id; })[0];
  if (!s){ editLine = null; openDetail(detailKey, true); return; }
  var box = $("lineAmt");
  var v = parseInt(String((box && box.value) || "").replace(/[^\d]/g, ""), 10);
  if (!(v > 0)){ toast("金額要大於 0"); return; }
  s.amount = v;
  if (editLineCat) s.cat = editLineCat;
  s.synced = 0;
  try { await putSale(s); } catch(e){ showStorageWarning(); }
  editLine = null;
  renderAll();
  openDetail(detailKey, true);
  toast("這一件已更新");
}
async function delLine(id){
  if (itemsOfOrder(detailKey).length < 2) return;   // 最後一件要用「刪除整張訂單」
  sales = sales.filter(function(x){ return x.id !== id; });
  await delSale(id);
  editLine = null;
  renderAll();
  openDetail(detailKey, true);
  toast("已從這張訂單移除一件");
}

/* ---------- 儲存空間的耐久度 ---------- */
async function askPersist(){
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    var ok = await navigator.storage.persisted();
    if (!ok) ok = await navigator.storage.persist();      // 請瀏覽器別在空間不足時清掉這個網站
    storageMode = ok ? "persisted" : "best-effort";
  } catch(e){ storageMode = ""; }
}
async function storageUsed(){
  try {
    if (!navigator.storage || !navigator.storage.estimate) return "";
    var e = await navigator.storage.estimate();
    return kb(e.usage || 0);
  } catch(e){ return ""; }
}
function showPreviewWarning(){

    "真的要用來記帳，請開 App 版的網址，並加到主畫面。";

}

/* ---------- storage warning ---------- */
function showStorageWarning(){
  if ($("storeWarn")) return;
  var w = document.createElement("div");

/* ---------- nav ---------- */
function syncNav(){
  document.querySelectorAll("#nav button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-view") === view);
  });
  $("view-today").hidden = view !== "today";
  $("view-log").hidden = view !== "log";
  $("view-stats").hidden = view !== "stats";
  $("view-set").hidden = view !== "set";
  $("fab").hidden = view === "set";
}

/* ---------- events ---------- */
$("nav").addEventListener("click", function(e){
  var b = e.target.closest("button[data-view]"); if (!b) return;
  view = b.getAttribute("data-view");
  renamingCat = null;
  syncNav(); renderAll();
  window.scrollTo(0, 0);
});
$("fab").addEventListener("click", openSheet);
$("cancelEntry").addEventListener("click", closeSheet);
$("toStep2").addEventListener("click", toStep2);
$("next1").addEventListener("click", toStep2);
$("addMore").addEventListener("click", addLine);
$("qtyMinus").addEventListener("click", function(){
  if (draft.qty > 1){ draft.qty--; renderAmount(); }
});
$("qtyPlus").addEventListener("click", function(){
  if (draft.qty < 99){ draft.qty++; renderAmount(); }
});
$("cartList").addEventListener("click", function(e){
  var b = e.target.closest("[data-cart-del],[data-cart-inc],[data-cart-dec]"); if (!b) return;
  var i;
  if (b.hasAttribute("data-cart-del")) draft.cart.splice(+b.getAttribute("data-cart-del"), 1);
  else if (b.hasAttribute("data-cart-inc")){
    i = +b.getAttribute("data-cart-inc");
    if (lineQty(draft.cart[i]) < 99) draft.cart[i].qty = lineQty(draft.cart[i]) + 1;
  } else {
    i = +b.getAttribute("data-cart-dec");
    // 減到 0 就是把這列抽掉，不要留一列 0 件
    if (lineQty(draft.cart[i]) > 1) draft.cart[i].qty = lineQty(draft.cart[i]) - 1;
    else draft.cart.splice(i, 1);
  }
  renderCart(); renderAmount();
});
$("changeToggle").addEventListener("click", function(){
  if (!$("changePanel").hidden){ closeChange(); return; }   // 再按一次就收回去
  $("changePanel").hidden = false;
  $("changeBack").hidden = false;
  this.setAttribute("aria-expanded", "true");
  renderChange();
});
// 遮罩層存在的理由：小視窗是蓋在收款按鈕上面的，
// 沒有它的話，滱到旁邊就會直接按到「現金」把這筆成交掉。
$("changeBack").addEventListener("click", closeChange);
$("changeClose").addEventListener("click", closeChange);
$("cashPad").addEventListener("click", function(e){
  var b = e.target.closest("button[data-k]"); if (!b || !draft) return;
  var k = b.getAttribute("data-k");
  if (k === "del") cashStr = cashStr.slice(0, -1);
  else if (cashStr.length < 7) cashStr = (cashStr + k).replace(/^0+(?=\d)/, "");
  renderChange();
});

  $("step2").hidden = true; $("step1").hidden = false; $("sheet").scrollTop = 0;
});
$("closeDetail").addEventListener("click", closeDetail);
$("copyDayBtn").addEventListener("click", copyDaySummary);

$("shotBtn").addEventListener("click", function(){ $("shotInput").click(); });
$("shotClear").addEventListener("click", function(){ pendingPhoto = null; resetShot(); });
$("shotInput").addEventListener("change", async function(){
  var f = this.files && this.files[0];
  if (!f) return;
  try {
    pendingPhoto = await shrink(f);
    $("shotImg").src = pendingPhoto;
    $("shotWrap").hidden = false;

$("catChips").addEventListener("click", function(e){
  var b = e.target.closest("[data-cat]"); if (!b) return;
  draft.cat = b.getAttribute("data-cat");
  var p = catPrice(draft.cat);
  // 有預設價就帶入，接著按鍵盤能改成現場價；沒設價的就清空，
  // 不然上一個品項的金額會留在框裡，再按數字變成接在後面（650 → 650420）。
  draft.amount = p ? String(p) : "";
  renderCats(); renderAmount();
});

$("pad").addEventListener("click", function(e){
  var b = e.target.closest("button[data-k]"); if (!b) return;
  var k = b.getAttribute("data-k");
  if (k === "del") draft.amount = draft.amount.slice(0, -1);
  else if (draft.amount.length < 7) draft.amount = (draft.amount + k).replace(/^0+(?=\d)/, "");
  renderAmount();
});
$("quickAmts").addEventListener("click", function(e){
  var b = e.target.closest("button[data-amt]"); if (!b) return;
  draft.amount = b.getAttribute("data-amt");
  renderAmount();
});
$("statSeg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-range]"); if (!b) return;
  statRange = b.getAttribute("data-range");
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });

});

/* settings is re-rendered on every change, so its controls are delegated */
$("setBody").addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-grip"))         { return; }
  if (t.hasAttribute("data-edit"))         { renamingCat = t.getAttribute("data-edit"); renderSettings(); return; }
  if (t.hasAttribute("data-edit-ok"))      { doEditCat(t.getAttribute("data-edit-ok")); return; }
  if (t.hasAttribute("data-edit-cancel"))  { renamingCat = null; renderSettings(); return; }
  if (t.hasAttribute("data-del"))          { deleteCat(t.getAttribute("data-del")); return; }
  if (t.id === "newCatOk"){
    addCat($("newCat").value, $("newCatPrice").value).then(function(ok){ if (ok){ renderSettings(); toast("已新增品項"); } });
    return;
  }
  if (t.id === "cloudSaveBtn"){ saveCloud(); return; }
  if (t.id === "cloudPingBtn"){ cloudPing(t); return; }
  if (t.id === "cloudPush")   { pushAll(t); return; }
  if (t.id === "cloudPull")   { pullAll(t); return; }
  if (t.id === "copyCsv")    { copyText(csvText(), sales.length + " 筆明細已複製"); return; }
  if (t.id === "expLedger")  { showExport(ledgerJSON(), "帳目備份"); return; }
  if (t.id === "expFull")    { fullJSON().then(function(x){ showExport(x, "完整備份（含照片）"); }); return; }
  if (t.id === "impRun")     { runImport(); return; }
  if (t.id === "clearDemo")  { clearDemo(); return; }
});
$("setBody").addEventListener("keydown", function(e){
  if (e.target.hasAttribute && e.target.hasAttribute("data-grip") && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    e.preventDefault();                               // 鍵盤也能排序
    moveCat(+e.target.getAttribute("data-grip"), e.key === "ArrowUp" ? -1 : 1);
    return;
  }
  if (e.key !== "Enter") return;
  if (e.target.id === "newCat" || e.target.id === "newCatPrice") $("newCatOk").click();
  if ((e.target.id === "editName" || e.target.id === "editPrice") && renamingCat) doEditCat(renamingCat);
});
$("setBody").addEventListener("pointerdown", catDragStart);
document.addEventListener("pointermove", catDragMove, {passive:false});
document.addEventListener("pointerup", catDragEnd);
document.addEventListener("pointercancel", catDragEnd);

document.addEventListener("click", function(e){
  var r = e.target.closest(".row[data-order]");
  if (r) openDetail(r.getAttribute("data-order"));
});

/* 明細頁每次都重畫 innerHTML，所以「訂單內容」那張卡的按鈕用委派，掛在不會被換掉的容器上 */
$("detailBody").addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-line")){
    editLine = t.getAttribute("data-line");
    var it = sales.filter(function(x){ return x.id === editLine; })[0];
    editLineCat = it ? it.cat : "";
    openDetail(detailKey, true);
    return;
  }
  if (t.hasAttribute("data-line-cancel")){ editLine = null; openDetail(detailKey, true); return; }
  if (t.hasAttribute("data-line-cat")){
    editLineCat = t.getAttribute("data-line-cat");
    var box = $("lineCats");
    if (box) box.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("on", c === t); });
    return;
  }
  if (t.hasAttribute("data-line-ok")){ saveLine(t.getAttribute("data-line-ok")); return; }
  if (t.hasAttribute("data-line-del")){ delLine(t.getAttribute("data-line-del")); return; }
});
$("detailBody").addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.id === "lineAmt" && editLine){ e.preventDefault(); saveLine(editLine); }
});

$("payBtns").innerHTML = PAYS.map(function(p){
  return '<button type="button" class="pay-btn ' + p.k + '" data-pay="' + p.k + '">' +
    "<span>" + p.n + '</span><span class="hint">' + p.hint + "</span></button>";
}).join("");
$("payBtns").addEventListener("click", function(e){
  var b = e.target.closest("button[data-pay]"); if (!b) return;
  commit(b.getAttribute("data-pay"));
});

/* ---------- boot ---------- */
(async function boot(){
  syncNav();
  renderAll();
  try {
    db = await openDB();
    var saved = await req(tx("sales").getAll());
    sales = (saved || []).sort(function(a,b){ return a.ts - b.ts; });
    var c = await req(tx("meta").get("cats"));
    if (Array.isArray(c) && c.length){
      var saved = normCats(c);
      // 還是第一版的出廠清單就換成新的；只要使用者自己動過就原封不動
      var untouched = saved.length === CATS_V1.length && saved.every(function(x, i){
        return x.name === CATS_V1[i] && !x.price;
      });
      cats = untouched ? CATS_DEFAULT.map(function(x){ return {name:x.name, price:x.price}; }) : saved;
      if (untouched) await saveCats();
    }
    var cl = await req(tx("meta").get("cloud"));
    if (cl && cl.url) cloud = {url:String(cl.url), token:String(cl.token || ""), at:Number(cl.at) || 0};
  } catch(e){
    showStorageWarning();
  }
  await askPersist();
  if (isPreview) showPreviewWarning();
  renderAll();
})();
</script>
