<title>Posy POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column — sticky day total on top, fixed bottom nav, full-screen two-step entry sheet. */
:root{
  --bg:#fdeeea; --surface:#ffffff; --surface-2:#fbe2dc; --line:#f2cec6;
  --ink:#2a1a18; --muted:#8a6b66; --faint:#c2a5a0;
  --accent:#e4716a; --accent-ink:#ffffff; --accent-soft:#fcdfda;
  --cash:#2f7a4f; --bank:#3160a4; --linepay:#1f8a3b; --danger:#b3362b;
  --shadow:0 2px 12px rgba(120,70,64,.10);
  --ui:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Playfair Display",Georgia,"Songti TC",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1412; --surface:#271d1b; --surface-2:#332624; --line:#42302d;
  --ink:#f6e9e6; --muted:#b69a95; --faint:#7d6360;
  --accent:#ef8a83; --accent-ink:#2a100d; --accent-soft:#3c2724;
  --cash:#5bbd84; --bank:#86b0ec; --linepay:#5cc777; --danger:#ef8075;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1c1412; --surface:#271d1b; --surface-2:#332624; --line:#42302d;
  --ink:#f6e9e6; --muted:#b69a95; --faint:#7d6360;
  --accent:#ef8a83; --accent-ink:#2a100d; --accent-soft:#3c2724;
  --cash:#5bbd84; --bank:#86b0ec; --linepay:#5cc777; --danger:#ef8075;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0 auto; max-width:480px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 116px;
  background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---- sticky day summary ---- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:14px 10px;
  border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.count{color:var(--muted);font-size:13px;padding-bottom:4px}
.paybar{display:flex;gap:8px;margin-top:10px}
.paybar .cell{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.paybar .cell b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.paybar .cell span{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.cash b{color:var(--cash)} .bank b{color:var(--bank)} .linepay b{color:var(--linepay)}

/* ---- sale rows ---- */
h2.sec{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:22px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px 9px 9px;
}
.row:active{background:var(--surface-2)}
.thumb{width:46px;height:46px;border-radius:9px;flex:none;object-fit:cover;background:var(--surface-2);display:block}
.thumb.empty{display:grid;place-items:center;color:var(--faint);font-size:17px}
.thumb.lost{color:var(--danger);font-size:15px}
.row .mid{flex:1;min-width:0}
.row .cat{font-weight:500}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;opacity:.4}
.row .amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;flex:none}
.tag{font-size:11px;font-weight:500}
.tag.cash{color:var(--cash)} .tag.bank{color:var(--bank)} .tag.linepay{color:var(--linepay)}

.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center}
.empty-state p{margin:0 0 4px;color:var(--muted);font-size:13.5px}
.empty-state .big{color:var(--ink);font-size:15px;font-weight:500;margin-bottom:8px}

/* ---- day group in log ---- */
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;gap:10px}
.day-head .d{font-weight:700;font-size:14.5px}
.day-head .s{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* ---- stats ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.2}
.tile span{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--surface-2);border-radius:10px;padding:3px;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 0;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:4.5em 1fr auto;gap:9px;align-items:center;font-size:13px}
.bar-row .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--accent)}
.fill.cash{background:var(--cash)} .fill.bank{background:var(--bank)} .fill.linepay{background:var(--linepay)}
.bar-row .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:4px}
.spark .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.spark .col i{display:block;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px}
.spark .col i.hot{background:var(--accent)}
.spark-x{display:flex;gap:3px;margin-top:5px}
.spark-x span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--faint);font-family:var(--num)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.note-text{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px;font-weight:500;text-align:center}
.btn + .btn{margin-top:8px}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}

/* ---- category manager ---- */
.cat-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.cat-row{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:11px;padding:7px 8px 7px 11px}
.cat-row .nm{flex:1;min-width:0;overflow:hidden}
.cat-row .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .nm em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-family:var(--num)}
.cat-row.edit{flex-wrap:wrap}
.cat-row.edit input[type=text]{flex:1 1 7em}
.cat-row.dragging{opacity:.9;box-shadow:0 6px 16px rgba(120,70,64,.22);background:var(--surface)}
.mini.grip{cursor:grab;touch-action:none;color:var(--faint);font-size:15px;letter-spacing:-1px}
.cat-row.dragging .mini.grip{cursor:grabbing}
.wordmark{font-family:var(--display);font-size:27px;font-weight:600;line-height:1.1;margin:2px 0 14px}
.wordmark span{color:var(--accent)}
.chip em{font-style:normal;font-family:var(--num);font-size:12px;opacity:.7;margin-left:3px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;flex:none;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.mini:disabled{opacity:.3}
.mini.x{color:var(--danger)}
.cat-row input[type=text]{flex:1;min-width:0;padding:7px 9px}
.inline-add{display:flex;gap:7px;margin-top:10px}

input[type=text],textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:11px 12px;font:inherit;
}
textarea{resize:vertical;min-height:90px;font-family:var(--num);font-size:11.5px;line-height:1.35}

/* ---- fab + nav ---- */
.fab{
  position:fixed; z-index:25;
  left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(60px + env(safe-area-inset-bottom,0px));
  max-width:448px; margin:0 auto;
  border:0; border-radius:13px; padding:15px;
  background:var(--accent); color:var(--accent-ink);
  font-size:16.5px; font-weight:700; letter-spacing:.02em;
  box-shadow:0 6px 18px rgba(200,90,82,.32);
}
.nav{
  position:fixed; inset:auto 0 0; z-index:26;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px)); padding-right:max(0px,env(safe-area-inset-right,0px));
}
.nav button{flex:1;border:0;background:transparent;padding:13px 0 14px;font-size:13px;color:var(--muted);font-weight:500}
.nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}

/* ---- sheets ---- */
.sheet{
  position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet-in{max-width:448px;margin:0 auto}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-bar h1{font-size:16px;font-weight:700;margin:0}
.sheet-bar button{border:0;background:transparent;padding:6px 2px;color:var(--accent);font-weight:500;font-size:14px}
.field{margin-top:14px}
.field > label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:7px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.shot{
  width:100%;border:1px dashed var(--line);background:var(--surface);border-radius:var(--r);
  padding:16px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:14px;
}
.shot-wrap{position:relative}
.shot-img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block;border:1px solid var(--line)}
.shot-x{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;width:32px;height:32px;font-size:15px;line-height:1}
.amount-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.amount-box .cur{color:var(--muted);font-size:15px;font-weight:500}
.amount-box .val{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:36px;font-weight:600;line-height:1.1}
.amount-box .val.zero{color:var(--faint)}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-family:var(--num);font-size:13.5px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.pad button{
  border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:15px 0;
  font-family:var(--num);font-size:22px;font-weight:500;
}
.pad button:active{background:var(--surface-2)}
.pad button.wide{font-family:var(--ui);font-size:15px}
.recap{background:var(--accent-soft);border-radius:var(--r);padding:13px 15px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.recap .l{font-weight:500}
.recap .r{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600}
.pays{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.pay-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:17px 18px;
  font-size:17px;font-weight:700;
}
.pay-btn .hint{font-size:12px;font-weight:400;color:var(--muted)}
.pay-btn.cash{color:var(--cash)} .pay-btn.bank{color:var(--bank)} .pay-btn.linepay{color:var(--linepay)}
.detail-img{width:100%;border-radius:var(--r);display:block;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500}

.toast{
  position:fixed;z-index:50;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(126px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);font-size:14px;
}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:2px 4px}
.warn{background:var(--surface);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:13px;margin-top:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-row">
    <div>
      <div class="eyebrow" id="todayLabel">今天</div>
      <div class="total num" id="todayTotal">NT$0</div>
    </div>
    <div class="count" id="todayCount">0 筆</div>
  </div>
  <div class="paybar" id="todayPays"></div>
</header>

<main>
  <section id="view-today">
    <h2 class="sec">今天的紀錄</h2>
    <div class="list" id="todayList"></div>
    <button type="button" class="btn" id="copyDayBtn" style="margin-top:14px" hidden>複製今日結帳</button>
  </section>

  <section id="view-log" hidden>
    <h2 class="sec">全部紀錄</h2>
    <div id="logBody"></div>
  </section>

  <section id="view-stats" hidden>
    <h2 class="sec">統計</h2>
    <div class="seg" id="statSeg">
      <button data-range="month" class="on">本月</button>
      <button data-range="all">全部</button>
    </div>
    <div id="statBody"></div>
  </section>

  <section id="view-set" hidden>
    <h2 class="sec">設定</h2>
    <div id="setBody"></div>
  </section>
</main>

<button class="fab" id="fab">＋ 記一筆</button>

<nav class="nav" id="nav">
  <button data-view="today" class="on">今天</button>
  <button data-view="log">紀錄</button>
  <button data-view="stats">統計</button>
  <button data-view="set">設定</button>
</nav>

<!-- ===== entry sheet ===== -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div id="step1">
      <div class="sheet-bar">
        <button type="button" id="cancelEntry">取消</button>
        <h1>記一筆</h1>
        <button type="button" id="toStep2" style="color:var(--muted)">下一步</button>
      </div>

      <div class="field">
        <label for="shotInput">商品照片（選填）</label>
        <input type="file" id="shotInput" accept="image/*" hidden>
        <button type="button" class="shot" id="shotBtn">＋ 拍照／從相簿選</button>
        <div class="shot-wrap" id="shotWrap" hidden>
          <img class="shot-img" id="shotImg" alt="這筆商品的照片">
          <button type="button" class="shot-x" id="shotClear" aria-label="移除照片">✕</button>
        </div>
      </div>

      <div class="field">
        <label>品項</label>
        <div class="chips" id="catChips"></div>
        <p class="note-text">點品項會自動帶入它的預設價，直接按下面的鍵盤就能改成現場的價錢。預設價、改名、順序都在「設定」頁。</p>
      </div>

      <div class="field">
        <label>金額</label>
        <div class="amount-box">
          <span class="cur">NT$</span>
          <span class="val zero" id="amtVal">0</span>
        </div>
        <div class="quick" id="quickAmts"></div>
        <div class="pad" id="pad">
          <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
          <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
          <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
          <button type="button" data-k="00" class="wide">00</button><button type="button" data-k="0">0</button><button type="button" data-k="del" class="wide">⌫</button>
        </div>
      </div>

      <div class="field">
        <button type="button" class="btn primary" id="next1" disabled>下一步：收款方式</button>
      </div>
    </div>

    <div id="step2" hidden>
      <div class="sheet-bar">
        <button type="button" id="backStep1">← 上一步</button>
        <h1>收款方式</h1>
        <span style="width:3.4em"></span>
      </div>

      <div class="recap">
        <span class="l" id="recapCat">—</span>
        <span class="r num" id="recapAmt">NT$0</span>
      </div>

      <div class="field">
        <label for="noteInput">備註（選填，例如賣給誰）</label>
        <input type="text" id="noteInput" placeholder="例：市集攤友、客人訂做" maxlength="40">
      </div>

      <div class="pays" id="payBtns"></div>
      <p class="note-text">按下收款方式就完成這一筆，按錯可以馬上撤銷。</p>
    </div>
  </div>
</div>

<!-- ===== detail sheet ===== -->
<div class="sheet" id="detail" hidden>
  <div class="sheet-in">
    <div class="sheet-bar">
      <button type="button" id="closeDetail">← 返回</button>
      <h1>這一筆</h1>
      <span style="width:3.4em"></span>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastAct">撤銷</button></div>

<script>
"use strict";
/* ---------- constants ---------- */
var PAYS = [
  {k:"cash",    n:"現金",     hint:"收現、找零"},
  {k:"bank",    n:"匯款",     hint:"轉帳、ATM"},
  {k:"linepay", n:"LINE Pay", hint:"掃碼收款"}
];
var PAYMAP = {cash:"現金", bank:"匯款", linepay:"LINE Pay"};
var CATS_DEFAULT = [
  {name:"項鍊", price:0}, {name:"手鍊", price:0}, {name:"戒指", price:0},
  {name:"耳環", price:0}, {name:"其他", price:0}
];
var MAX_EDGE = 800, JPEG_Q = 0.7;

/* ---------- state ---------- */
var sales = [];           // {id, ts, cat, amount, pay, note, hasPhoto, demo}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function money(n){ return "NT$" + Math.round(n).toLocaleString("zh-TW"); }
function pad2(n){ return (n<10?"0":"") + n; }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function monthKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth()+1); }
function hhmm(ts){ var d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function dayLabel(key){
  var p = key.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  var w = ["日","一","二","三","四","五","六"][d.getDay()];
  return (+p[1]) + "/" + (+p[2]) + "（" + w + "）";
}
function todayKey(){ return dayKey(Date.now()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function kb(n){ return n > 1024*1024 ? (n/1024/1024).toFixed(1) + " MB" : Math.round(n/1024) + " KB"; }

/* ---------- storage (IndexedDB; photos are stored as data-URL strings) ---------- */
function openDB(){
  return new Promise(function(res, rej){
    var r;
    try { r = indexedDB.open("stall-pos", 1); } catch(e){ rej(e); return; }
    r.onupgradeneeded = function(){
      var d = r.result;
      if (!d.objectStoreNames.contains("sales")) d.createObjectStore("sales", {keyPath:"id"});
      if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos");
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function tx(store, mode){ return db.transaction(store, mode || "readonly").objectStore(store); }
function req(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
async function putSale(s){ if (db) await req(tx("sales","readwrite").put(s)); }
async function delSale(id){
  if (!db) return;
  await req(tx("sales","readwrite").delete(id));
  try { await req(tx("photos","readwrite").delete(id)); } catch(e){}
  photoMem.delete(id);
}
async function putPhoto(id, dataURL){ if (db) await req(tx("photos","readwrite").put(dataURL, id)); }
async function getPhoto(id){ if (!db) return null; try { return await req(tx("photos").get(id)); } catch(e){ return null; } }
async function putMeta(k, v){ if (db) try { await req(tx("meta","readwrite").put(v, k)); } catch(e){} }
async function saveCats(){ await putMeta("cats", cats); }

function blobToDataURL(b){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.readAsDataURL(b);
  });
}
async function photoSrc(id){
  if (photoMem.has(id)) return photoMem.get(id);
  var v = await getPhoto(id);
  if (!v) return null;
  if (typeof v !== "string"){            // written by the first build, which stored Blobs
    try { v = await blobToDataURL(v); await putPhoto(id, v); } catch(e){ return null; }
  }
  photoMem.set(id, v);
  return v;
}

/* ---------- image shrinking ---------- */
async function shrink(file){
  var src = null;
  try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){
    src = await new Promise(function(res, rej){
      var u = URL.createObjectURL(file), i = new Image();
      i.onload = function(){ URL.revokeObjectURL(u); res(i); };
      i.onerror = function(){ URL.revokeObjectURL(u); rej(new Error("讀不到這張圖")); };
      i.src = u;
    });
  }
  var w = src.width, h = src.height, s = Math.min(1, MAX_EDGE / Math.max(w, h));
  var cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
  var c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  c.getContext("2d").drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close();
  return c.toDataURL("image/jpeg", JPEG_Q);
}

/* ---------- aggregation ---------- */
function sumOf(list){ var t = 0; for (var i=0;i<list.length;i++) t += list[i].amount; return t; }
function byDay(key){ return sales.filter(function(s){ return dayKey(s.ts) === key; }); }
function payTotals(list){
  var o = {cash:0, bank:0, linepay:0};
  list.forEach(function(s){ if (o[s.pay] === undefined) o[s.pay] = 0; o[s.pay] += s.amount; });
  return o;
}
function usedCount(cat){ return sales.filter(function(s){ return s.cat === cat; }).length; }
function normCats(v){
  var out = [];
  (v || []).forEach(function(c){
    if (typeof c === "string") out.push({name:c, price:0});                       // first build stored plain names
    else if (c && c.name) out.push({name:String(c.name), price:Math.max(0, parseInt(c.price, 10) || 0)});
  });
  return out.length ? out : CATS_DEFAULT.map(function(c){ return {name:c.name, price:c.price}; });
}
function catIndex(name){ for (var i=0;i<cats.length;i++) if (cats[i].name === name) return i; return -1; }
function catPrice(name){ var i = catIndex(name); return i === -1 ? 0 : cats[i].price; }
function quickAmounts(){
  var count = {};
  sales.forEach(function(s){ count[s.amount] = (count[s.amount]||0) + 1; });
  return Object.keys(count)
    .map(function(a){ return {a:+a, c:count[a]}; })
    .sort(function(x,y){ return y.c - x.c || y.a - x.a; })
    .slice(0, 6)
    .sort(function(x,y){ return x.a - y.a; })
    .map(function(o){ return o.a; });
}

async function hydrateThumbs(root){
  var imgs = root.querySelectorAll("img[data-photo]");
  for (var i=0;i<imgs.length;i++){
    var el = imgs[i];
    var u = await photoSrc(el.getAttribute("data-photo"));
    if (u) el.src = u;
    else el.outerHTML = '<span class="thumb empty lost" title="這張照片存不見了">⚠</span>';
  }
}

function renderLog(){
  var el = $("logBody");
  if (!sales.length){
    el.innerHTML = '<div class="empty-state"><p class="big">還沒有任何紀錄</p><p>記的每一筆都會按日期收在這裡。</p></div>';
    return;
  }
  var groups = {};
  sales.forEach(function(s){ var k = dayKey(s.ts); (groups[k] = groups[k] || []).push(s); });
  var keys = Object.keys(groups).sort().reverse();
  el.innerHTML = keys.map(function(k){
    var g = groups[k].slice().sort(function(a,b){ return b.ts - a.ts; });
    return '<div class="day-head"><span class="d">' + dayLabel(k) + "</span>" +
      '<span class="s">' + g.length + " 筆・" + money(sumOf(g)) + "</span></div>" +
      '<div class="list">' + g.map(rowHTML).join("") + "</div>";
  }).join("");
  hydrateThumbs(el);
}

function renderStats(){
  var list = statRange === "month"
    ? sales.filter(function(s){ return monthKey(s.ts) === monthKey(Date.now()); })
    : sales.slice();
  var total = sumOf(list), n = list.length;
  var el = $("statBody");
  if (!n){
    el.innerHTML = '<div class="empty-state" style="margin-top:12px"><p class="big">這段期間還沒有紀錄</p><p>記幾筆之後，這裡會算出品項和收款方式的佔比。</p></div>';
    return;
  }

  var pt = payTotals(list);
  var payMax = Math.max(pt.cash, pt.bank, pt.linepay, 1);

  var catAgg = {};
  list.forEach(function(s){
    var c = catAgg[s.cat] = catAgg[s.cat] || {sum:0, n:0};
    c.sum += s.amount; c.n++;
  });
  var catRows = Object.keys(catAgg).map(function(k){ return {k:k, sum:catAgg[k].sum, n:catAgg[k].n}; })
    .sort(function(a,b){ return b.sum - a.sum; });
  var catMax = catRows.length ? catRows[0].sum : 1;

  var days = [];
  for (var i=13;i>=0;i--){
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    var k = dayKey(d.getTime());
    days.push({k:k, sum:sumOf(byDay(k)), d:d});
  }
  var dayMax = Math.max.apply(null, days.map(function(x){ return x.sum; }).concat([1]));

  el.innerHTML =
    '<div class="tiles" style="margin-top:12px">' +
      '<div class="tile"><b>' + money(total) + "</b><span>營收</span></div>" +
      '<div class="tile"><b>' + n + "</b><span>筆數</span></div>" +
      '<div class="tile"><b>' + money(total/n) + "</b><span>平均單價</span></div>" +
    "</div>" +

    '<div class="card" style="margin-top:10px"><div class="eyebrow">收款方式</div><div class="bars" style="margin-top:10px">' +
      PAYS.map(function(p){
        var v = pt[p.k] || 0;
        return '<div class="bar-row"><span class="label">' + p.n + "</span>" +
          '<span class="track"><i class="fill ' + p.k + '" style="width:' + (v/payMax*100).toFixed(1) + '%"></i></span>' +
          '<span class="v">' + money(v) + "</span></div>";
      }).join("") +
    "</div></div>" +

    '<div class="card"><div class="eyebrow">品項</div><div class="bars" style="margin-top:10px">' +
      catRows.map(function(c){
        return '<div class="bar-row"><span class="label">' + esc(c.k) + "</span>" +
          '<span class="track"><i class="fill" style="width:' + (c.sum/catMax*100).toFixed(1) + '%"></i></span>' +
          '<span class="v">' + c.n + "件・" + money(c.sum) + "</span></div>";
      }).join("") +
    "</div></div>" +

    '<div class="card"><div class="eyebrow">近 14 天</div>' +
      '<div class="spark">' + days.map(function(x){
        var h = (x.sum / dayMax * 100).toFixed(1);
        return '<span class="col" title="' + x.k + " " + money(x.sum) + '"><i class="' + (x.sum?"hot":"") + '" style="height:' + h + '%"></i></span>';
      }).join("") + "</div>" +
      '<div class="spark-x">' + days.map(function(x, i){
        return "<span>" + (i % 3 === 0 ? (x.d.getMonth()+1) + "/" + x.d.getDate() : "") + "</span>";
      }).join("") + "</div>" +
      '<p class="note-text">最高的一天 ' + money(dayMax) + "</p>" +
    "</div>";
}

/* ---------- 品項拖曳排序 ---------- */
/* 拖的時候直接搬 DOM 節點、不重畫，否則手指底下的元素被換掉就收不到後續事件。 */
var dragEl = null;
function catDragStart(e){
  var grip = e.target.closest("[data-grip]");
  if (!grip || !$("catList")) return;
  dragEl = grip.closest(".cat-row");
  if (!dragEl) return;
  dragEl.classList.add("dragging");
  e.preventDefault();
}
function catDragMove(e){
  if (!dragEl) return;
  e.preventDefault();
  var list = $("catList");
  if (!list) { dragEl = null; return; }
  var rows = [].slice.call(list.children).filter(function(n){ return n !== dragEl; });
  var before = null;
  for (var i=0;i<rows.length;i++){
    var r = rows[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height/2){ before = rows[i]; break; }
  }
  if (before) list.insertBefore(dragEl, before);
  else list.appendChild(dragEl);
}
async function catDragEnd(){
  if (!dragEl) return;
  dragEl.classList.remove("dragging");
  dragEl = null;
  var list = $("catList");
  if (!list) return;
  var order = [].slice.call(list.children).map(function(n){ return n.getAttribute("data-name"); });
  var next = [];
  order.forEach(function(nm){ var i = catIndex(nm); if (i !== -1) next.push(cats[i]); });
  if (next.length === cats.length) cats = next;      // 只有完全對得起來才採用
  await saveCats();
  renderSettings();
}

/* ---------- category management ---------- */
async function moveCat(i, dir){
  var j = i + dir;
  if (j < 0 || j >= cats.length) return;
  var t = cats[i]; cats[i] = cats[j]; cats[j] = t;
  await saveCats();
  renderSettings();
}
async function doEditCat(oldName){

  var i = catIndex(oldName);

  if (next !== oldName && catIndex(next) !== -1){ renderSettings(); toast("已經有同名的品項了"); return; }
  cats[i] = {name:next, price:price};
  var hit = next === oldName ? [] : sales.filter(function(s){ return s.cat === oldName; });
  for (var k=0;k<hit.length;k++){ hit[k].cat = next; hit[k].synced = 0; await putSale(hit[k]); }
  await saveCats();
  renderSettings(); renderTop();
  toast(hit.length ? "已更新，過去 " + hit.length + " 筆紀錄的品項一起改了" : "已更新");
}

  renderSettings();

  await saveCats();
  return true;
}

async function runImport(){

  var have = {};

  var added = 0, pics = 0;

  }
  if (Array.isArray(data.cats)){

/* ---------- Google 雲端同步（Apps Script 後端） ---------- */
function pendingCount(){ return sales.filter(function(s){ return !s.synced; }).length; }
async function cloudCall(action, payload){
  if (!cloud.url) throw new Error("還沒填 Apps Script 網址");
  var res = await fetch(cloud.url, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   // text/plain 才不會觸發 preflight
    body: JSON.stringify(Object.assign({action:action, token:cloud.token}, payload || {}))
  });
  var txt = await res.text(), out;
  try { out = JSON.parse(txt); }
  catch(e){ throw new Error("雲端回了看不懂的內容，確認網址是 /exec 結尾、部署權限是「任何人」"); }
  if (!out.ok) throw new Error(out.error || "雲端拒絕了這次請求");
  return out;
}
function cloudError(e){
  var m = String((e && e.message) || e);
  if (/failed to fetch|networkerror|load failed/i.test(m))
    m = "連不到雲端。如果你是從 Claude 的預覽網址開這一頁，同步只能在 App 版（GitHub Pages 的網址）用。";
  toast(m);
}
async function saveCloud(){
  cloud.url = String($("cloudUrl").value || "").trim();
  cloud.token = String($("cloudToken").value || "").trim();
  await putMeta("cloud", cloud);
  renderSettings();
  toast(cloud.url && !/\/exec$/.test(cloud.url) ? "存好了，但網址通常要用 /exec 結尾" : "雲端設定已存在這支手機");
}
async function cloudPing(btn){
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = "測試中…";
  try { var out = await cloudCall("ping", {}); toast(out.msg || "連上了"); }
  catch(e){ cloudError(e); }
  btn.disabled = false; btn.textContent = label;
}
function syncRow(s){
  return {id:s.id, ts:s.ts, cat:s.cat, amount:s.amount,
          pay:PAYMAP[s.pay] || s.pay, payKey:s.pay, note:s.note || "", hasPhoto:!!s.hasPhoto};
}
async function pushAll(btn){
  var label = btn.textContent;
  btn.disabled = true;
  try {
    var pend = sales.filter(function(s){ return !s.synced; });
    for (var i=0;i<pend.length;i+=120){
      var chunk = pend.slice(i, i+120);
      btn.textContent = "上傳帳目 " + Math.min(i + chunk.length, pend.length) + "/" + pend.length;
      await cloudCall("push", {sales: chunk.map(syncRow)});
    }
    var pics = sales.filter(function(s){ return s.hasPhoto && !s.photoUp; });
    for (var j=0;j<pics.length;j++){
      btn.textContent = "上傳照片 " + (j+1) + "/" + pics.length;
      var u = await photoSrc(pics[j].id);
      if (!u) continue;
      var r = await cloudCall("photo", {id:pics[j].id, dataUrl:u});
      pics[j].photoUp = r.fileId || "1";
      await putSale(pics[j]);
    }
    for (var k=0;k<pend.length;k++){ pend[k].synced = 1; await putSale(pend[k]); }
    cloud.at = Date.now();
    await putMeta("cloud", cloud);
    renderSettings();
    toast("上傳完成：帳目 " + pend.length + " 筆、照片 " + pics.length + " 張");
  } catch(e){
    btn.disabled = false; btn.textContent = label;
    cloudError(e);
  }
}
async function pullAll(btn){
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = "拉取中…";
  try {
    var out = await cloudCall("pull", {});
    var have = {};
    sales.forEach(function(s){ have[s.id] = true; });
    var inc = out.sales || [], added = 0;
    for (var i=0;i<inc.length;i++){
      var r = inc[i];
      if (!r || !r.id || have[String(r.id)]) continue;
      var s = {id:String(r.id), ts:Number(r.ts) || Date.now(), cat:String(r.cat || "其他"),
               amount:Math.max(0, parseInt(r.amount, 10) || 0), pay:String(r.payKey || "cash"),
               note:String(r.note || ""), hasPhoto:false, synced:1};
      if (r.photoUrl) s.photoUrl = String(r.photoUrl);   // 照片留在 Drive，這裡只帶連結
      sales.push(s); have[s.id] = true; added++;
      await putSale(s);
    }
    sales.sort(function(a,b){ return a.ts - b.ts; });
    renderAll();
    toast(added ? "拉回 " + added + " 筆（照片留在 Drive，點進該筆可開連結）" : "雲端沒有這支手機缺的紀錄");
  } catch(e){ cloudError(e); }
  btn.disabled = false; btn.textContent = label;
}

/* ---------- toast ---------- */
function toast(msg, actLabel, actFn){
  clearTimeout(undoTimer);
  $("toastMsg").textContent = msg;
  var b = $("toastAct");
  if (actLabel){
    b.hidden = false;
    b.textContent = actLabel;
    b.onclick = function(){ $("toast").hidden = true; if (actFn) actFn(); };
  } else {
    b.hidden = true; b.onclick = null;
  }
  $("toast").hidden = false;
  undoTimer = setTimeout(function(){ $("toast").hidden = true; }, actLabel ? 6000 : 2600);
}

}

  var b = e.target.closest("button[data-amt]"); if (!b) return;
  draft.amount = b.getAttribute("data-amt");
  renderAmount();
});
$("statSeg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-range]"); if (!b) return;
  statRange = b.getAttribute("data-range");
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
  renderStats();
});

/* settings is re-rendered on every change, so its controls are delegated */
$("setBody").addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-grip"))         { return; }
  if (t.hasAttribute("data-edit"))         { renamingCat = t.getAttribute("data-edit"); renderSettings(); return; }
  if (t.hasAttribute("data-edit-ok"))      { doEditCat(t.getAttribute("data-edit-ok")); return; }
  if (t.hasAttribute("data-edit-cancel"))  { renamingCat = null; renderSettings(); return; }
  if (t.hasAttribute("data-del"))          { deleteCat(t.getAttribute("data-del")); return; }
  if (t.id === "newCatOk"){
    addCat($("newCat").value, $("newCatPrice").value).then(function(ok){ if (ok){ renderSettings(); toast("已新增品項"); } });
    return;
  }
  if (t.id === "cloudSaveBtn"){ saveCloud(); return; }
  if (t.id === "cloudPingBtn"){ cloudPing(t); return; }
  if (t.id === "cloudPush")   { pushAll(t); return; }
  if (t.id === "cloudPull")   { pullAll(t); return; }
  if (t.id === "copyCsv")    { copyText(csvText(), sales.length + " 筆明細已複製"); return; }
  if (t.id === "expLedger")  { showExport(ledgerJSON(), "帳目備份"); return; }
  if (t.id === "expFull")    { fullJSON().then(function(x){ showExport(x, "完整備份（含照片）"); }); return; }
  if (t.id === "impRun")     { runImport(); return; }
  if (t.id === "clearDemo")  { clearDemo(); return; }
});
$("setBody").addEventListener("keydown", function(e){
  if (e.target.hasAttribute && e.target.hasAttribute("data-grip") && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    e.preventDefault();                               // 鍵盤也能排序
    moveCat(+e.target.getAttribute("data-grip"), e.key === "ArrowUp" ? -1 : 1);
    return;
  }
  if (e.key !== "Enter") return;
  if (e.target.id === "newCat" || e.target.id === "newCatPrice") $("newCatOk").click();
  if ((e.target.id === "editName" || e.target.id === "editPrice") && renamingCat) doEditCat(renamingCat);
});
$("setBody").addEventListener("pointerdown", catDragStart);
document.addEventListener("pointermove", catDragMove, {passive:false});
document.addEventListener("pointerup", catDragEnd);
document.addEventListener("pointercancel", catDragEnd);

document.addEventListener("click", function(e){
  var r = e.target.closest(".row[data-id]");
  if (r) openDetail(r.getAttribute("data-id"));
});

$("payBtns").innerHTML = PAYS.map(function(p){
  return '<button type="button" class="pay-btn ' + p.k + '" data-pay="' + p.k + '">' +
    "<span>" + p.n + '</span><span class="hint">' + p.hint + "</span></button>";
}).join("");
$("payBtns").addEventListener("click", function(e){
  var b = e.target.closest("button[data-pay]"); if (!b) return;
  commit(b.getAttribute("data-pay"));
});

/* ---------- boot ---------- */
(async function boot(){
  syncNav();
  renderAll();
  try {
    db = await openDB();
    var saved = await req(tx("sales").getAll());
    sales = (saved || []).sort(function(a,b){ return a.ts - b.ts; });
    var c = await req(tx("meta").get("cats"));
    if (Array.isArray(c) && c.length) cats = normCats(c);
    var cl = await req(tx("meta").get("cloud"));
    if (cl && cl.url) cloud = {url:String(cl.url), token:String(cl.token || ""), at:Number(cl.at) || 0};
  } catch(e){
    showStorageWarning();
  }
  await askPersist();
  if (isPreview) showPreviewWarning();
  renderAll();
})();
</script>
